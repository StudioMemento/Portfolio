<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Auren — Esperienza dimostrativa</title><style>
@font-face{font-family:Inter;src:url('/assets/fonts/InterVariable.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f3f0ea;font-family:Inter,Arial,sans-serif;overflow:hidden}.stage{position:relative;width:100%;height:100svh;min-height:300px}.visual{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s,transform .7s ease;transform:scale(1.05);pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#090909dc,transparent 76%),linear-gradient(0deg,#090909,transparent 60%)}.copy{position:absolute;left:6%;top:18%;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.08em;color:#aaa69f}.copy h1{font-size:clamp(46px,8vw,120px);font-weight:350;line-height:1;letter-spacing:-.035em;margin:32px 0 0;white-space:pre-line}.controls{position:absolute;left:6%;bottom:8%;display:flex;gap:30px}button{font:inherit;font-size:13px;background:none;color:#aaa69f;min-height:44px;border:0;padding:0;position:relative;cursor:pointer}button[aria-pressed=true]{color:#f3f0ea}button[aria-pressed=true]:after{content:'';height:2px;width:20px;position:absolute;left:0;bottom:0;background:#f2a10a}button:focus-visible{outline:2px solid #f2a10a;outline-offset:6px}.note{position:absolute;right:6%;bottom:9%;font-size:10px;color:#99958f}@media(max-width:600px){.visual{object-position:62% center}.shade{background:linear-gradient(0deg,#090909 0%,#09090933 55%,#09090999 100%)}.copy{top:16%}.copy h1{font-size:17vw}.note{right:auto;left:6%;bottom:3%}.controls{gap:24px;bottom:9%}.eyebrow{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="stage"><img class="visual" src="/assets/hero-fotografia.webp" alt="Flacone ambrato in una composizione di luce"><div class="shade"></div><div class="copy"><span class="eyebrow">AUREN / STUDIO INTERATTIVO</span><h1 id="headline">Dentro\nl’essenza.</h1></div><div class="controls" role="group" aria-label="Cambia atmosfera"><button aria-pressed="true" data-scene="0">Luce</button><button aria-pressed="false" data-scene="1">Materia</button><button aria-pressed="false" data-scene="2">Forma</button></div><span class="note">Esperienza dimostrativa</span></main><script>
const scenes=[['hero-fotografia','Dentro\nl’essenza.'],['foto-creativa','La materia.\nViva.'],['render-animazione','Ogni parte.\nUn insieme.']];const img=document.querySelector('.visual');const title=document.querySelector('h1');title.textContent=scenes[0][1];document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const i=Number(button.dataset.scene);img.src='/assets/'+scenes[i][0]+'.webp';title.textContent=scenes[i][1];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));if(!matchMedia('(prefers-reduced-motion:reduce)').matches)document.querySelector('.stage').addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;img.style.transform='scale(1.08) translate('+((e.clientX/innerWidth-.5)*-12)+'px,'+((e.clientY/innerHeight-.5)*-8)+'px)'});
</script></body></html>
